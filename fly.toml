app = "cheiron-e7vsuq"
primary_region = "ams"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Tasks live in memory: keep one machine up so a running query isn't killed mid-way.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
