# Release exploreclinicaltrials-mcp to PyPI when a version tag is pushed:
#   bump `version` in pyproject.toml, commit, then  git tag v0.1.0 && git push origin v0.1.0
# PyPI side, once: add a trusted publisher for this repo, workflow `release.yml`, environment `pypi`
# (https://docs.pypi.org/trusted-publishers/). No API token is stored anywhere.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: The wheel starts as an MCP server
        run: uvx --from dist/*.whl exploreclinicaltrials-mcp --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
