<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheiron</title>
<script src="/vendor/vega.min.js"></script>
<script src="/vendor/vega-lite.min.js"></script>
<script src="/vendor/vega-embed.min.js"></script>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f6fde; --warn-bg: #fff6e0; --warn: #8a5a00; --err-bg: #fdecec; --err: #a12020;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  textarea, input, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  textarea { min-height: 64px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px; }
  select[multiple] { height: 96px; }
  details summary { cursor: pointer; color: var(--muted); margin-top: 12px; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 18px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  #reset { background: #c62828; }
  #reset:hover { background: #a11f1f; }
  button:disabled { opacity: .5; cursor: default; }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .examples a { font-size: 13px; color: var(--accent); cursor: pointer; text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .status { color: var(--muted); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .error { background: var(--err-bg); color: var(--err); border-radius: 6px; padding: 10px 12px; }
  .warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 12px; margin: 4px 0; font-size: 14px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  #chart { width: 100%; min-height: 360px; }
  #network svg { width: 100%; height: auto; display: block; }
  dl { margin: 0; font-size: 14px; }
  dt { color: var(--muted); font-size: 12px; margin-top: 10px; }
  dd { margin: 2px 0 0; }
  code { font-size: 12px; background: #f0f0ec; padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
  #citations ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 420px; overflow: auto; }
  #citations li { border-top: 1px solid var(--line); padding: 6px 0; font-size: 13px; }
  #citations a { color: var(--accent); font-weight: 600; }
  #citations .trial-title { color: var(--text); margin: 2px 0; }
  .hidden { display: none !important; }
  /* Inside Claude (MCP App iframe) or opened from Claude (?result=): only the answer, no form. */
  html[data-mode="mcp-app"] main > h1, html[data-mode="mcp-app"] .sub, html[data-mode="mcp-app"] #form,
  html[data-mode="result"] #form { display: none; }
  html[data-mode="mcp-app"] main { padding: 8px; }
  label.file { display: inline-block; margin: 0; font-size: 14px; color: var(--accent); cursor: pointer; }
  label.file input { display: none; }
  #raw summary { margin: 0; }
  #raw pre { max-height: 480px; overflow: auto; font-size: 12px; background: #f0f0ec; padding: 10px; border-radius: 6px; margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Cheiron</h1>
  <p class="sub">Ask a question about ClinicalTrials.gov and get a chart with a source for every value.</p>

  <form id="form" class="panel">
    <label for="query">Question</label>
    <textarea id="query" name="query" required minlength="3" maxlength="500"
      placeholder="How has the number of trials for this drug changed over time?"></textarea>
    <div class="examples" id="examples"></div>

    <details>
      <summary>Filters (optional)</summary>
      <div class="grid">
        <div><label for="drug_name">Drug</label><input id="drug_name" name="drug_name" placeholder="Pembrolizumab"></div>
        <div><label for="condition">Condition</label><input id="condition" name="condition" placeholder="Breast cancer"></div>
        <div><label for="sponsor">Sponsor</label><input id="sponsor" name="sponsor"></div>
        <div><label for="country">Country</label><input id="country" name="country" placeholder="United States"></div>
        <div><label for="start_year">Start year from</label><input id="start_year" name="start_year" type="number" min="1900" max="2100"></div>
        <div><label for="end_year">Start year to</label><input id="end_year" name="end_year" type="number" min="1900" max="2100"></div>
        <div><label for="trial_phase">Phase</label>
          <select id="trial_phase" name="trial_phase" multiple>
            <option>EARLY_PHASE1</option><option>PHASE1</option><option>PHASE2</option>
            <option>PHASE3</option><option>PHASE4</option><option>NA</option>
          </select></div>
        <div><label for="recruitment_status">Status</label>
          <select id="recruitment_status" name="recruitment_status" multiple>
            <option>NOT_YET_RECRUITING</option><option>RECRUITING</option><option>ENROLLING_BY_INVITATION</option>
            <option>ACTIVE_NOT_RECRUITING</option><option>COMPLETED</option><option>SUSPENDED</option>
            <option>TERMINATED</option><option>WITHDRAWN</option><option>UNKNOWN</option>
          </select></div>
      </div>
    </details>

    <div class="row">
      <button id="submit" type="submit">Ask</button>
      <button id="reset" type="button">Reset</button>
      <label class="file">Open a saved response.json<input id="open-file" type="file" accept="application/json,.json"></label>
      <span id="status" class="status"></span>
    </div>
    <div id="progress" class="bar hidden"><div></div></div>
  </form>

  <div id="error" class="error hidden"></div>

  <section id="result" class="layout hidden">
    <div>
      <div class="panel">
        <div id="chart"></div>
        <div id="network" class="hidden"></div>
        <p class="hint">Click a bar, point or node to see the trials behind it.</p>
      </div>
      <div id="citations" class="panel hidden">
        <strong id="cite-title"></strong>
        <ul id="cite-list"></ul>
      </div>
      <details class="panel" id="raw">
        <summary>Response JSON</summary>
        <div class="row"><button type="button" id="copy-json">Copy</button></div>
        <pre id="raw-json"></pre>
      </details>
    </div>
    <aside class="panel" id="meta"></aside>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const POLL_MS = 1500;
const STAGES = ["queued", "planning", "fetching", "analyzing", "building", "saving", "done"];
// The question classes from the assignment brief: trends, distributions, comparisons, geography, networks.
const EXAMPLES = [
  "How has the number of trials for pembrolizumab changed per year since 2015?",
  "How are breast cancer trials distributed across phases?",
  "Compare phases for trials involving nivolumab vs pembrolizumab",
  "Which countries have the most recruiting trials for type 2 diabetes?",
  "Show a network of sponsors and drugs for melanoma trials",
  "What is the distribution of enrollment in phase 3 asthma trials?",
];
let polling = null;

for (const text of EXAMPLES) {
  const a = document.createElement("a");
  a.textContent = text;
  a.onclick = () => { $("query").value = text; $("query").focus(); };
  $("examples").append(a);
}

function buildRequest() {
  const form = new FormData($("form"));
  const body = {};
  for (const [key, value] of form.entries()) {
    const v = String(value).trim();
    if (!v) continue;
    if (key === "trial_phase" || key === "recruitment_status") (body[key] ??= []).push(v);
    else if (key === "start_year" || key === "end_year") body[key] = Number(v);
    else body[key] = v;
  }
  return body;
}

// Filters apply to one question: clear them once it is accepted (the question text stays).
function resetFilters() {
  for (const el of $("form").querySelectorAll("details input, details select")) {
    if (el.multiple) for (const opt of el.options) opt.selected = false;
    else el.value = "";
  }
}

function showError(message) {
  $("error").textContent = message;
  $("error").classList.remove("hidden");
}

function setBusy(busy, message = "") {
  $("submit").disabled = busy;
  $("status").textContent = message;
  $("progress").classList.toggle("hidden", !busy);
}

function showProgress(p) {
  let pct = (STAGES.indexOf(p.stage) / (STAGES.length - 1)) * 100;
  if (p.stage === "fetching" && p.trials_total) {
    const fetching = STAGES.indexOf("fetching") / (STAGES.length - 1);
    const next = STAGES.indexOf("analyzing") / (STAGES.length - 1);
    pct = (fetching + (next - fetching) * Math.min(1, p.trials_fetched / p.trials_total)) * 100;
  }
  $("progress").firstElementChild.style.width = `${Math.max(3, pct)}%`;
  $("status").textContent = p.message;
}

function describeValidationError(detail) {
  if (!Array.isArray(detail)) return String(detail);
  return detail.map((d) => `${(d.loc || []).filter((x) => x !== "body").join(".") || "request"}: ${d.msg}`).join("; ");
}

$("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  clearInterval(polling);
  $("error").classList.add("hidden");
  $("result").classList.add("hidden");
  setBusy(true, "Submitting…");
  try {
    const res = await fetch("/queries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildRequest()),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(describeValidationError(body.detail));
    resetFilters();
    history.replaceState(null, "", `?task=${body.task_id}`);
    poll(body.task_id);
  } catch (err) {
    setBusy(false);
    showError(err.message || "Could not submit the question.");
  }
});

function poll(taskId) {
  setBusy(true, "Waiting…");
  const tick = async () => {
    try {
      const res = await fetch(`/queries/${taskId}`);
      const task = await res.json();
      if (!res.ok) throw new Error(task.detail || `HTTP ${res.status}`);
      showProgress(task.progress);
      if (task.status === "succeeded") {
        clearInterval(polling);
        setBusy(false, task.progress.message);
        render(task.result);
      } else if (task.status === "failed") {
        clearInterval(polling);
        setBusy(false);
        showError(task.error ? task.error.message : "The query failed.");
      }
    } catch (err) {
      clearInterval(polling);
      setBusy(false);
      showError(err.message);
    }
  };
  tick();
  polling = setInterval(tick, POLL_MS);
}

// --- Rendering ------------------------------------------------------------------

async function render(result) {
  $("result").classList.remove("hidden");
  $("raw-json").textContent = JSON.stringify(result, null, 2);
  $("citations").classList.add("hidden");
  renderMeta(result.meta, result.visualization);
  const isNetwork = result.visualization.type === "network_graph";
  $("chart").classList.toggle("hidden", isNetwork);
  $("network").classList.toggle("hidden", !isNetwork);
  if (isNetwork) {
    renderNetwork(result.visualization);
  } else {
    const view = await vegaEmbed("#chart", result.vega_lite, { actions: { export: true, source: false, compiled: false, editor: true } });
    view.view.addEventListener("click", (_event, item) => {
      const datum = item && item.datum;
      const row = datum && datum._row != null ? result.visualization.data[datum._row] : null;  // sources live there
      if (row) showCitations(labelFor(datum, result.visualization.encoding), row.citations || [], datum.trial_count ?? 1);
    });
  }
}

function labelFor(datum, encoding) {
  return ["x", "color", "y"]
    .map((ch) => encoding[ch])
    .filter(Boolean)
    .map((c) => {
      let v = datum[c.field];
      if (c.type === "temporal" && v != null) v = String(v).slice(0, 10);
      if (c.labels && c.labels[v]) v = c.labels[v];  // display name for a coded value
      return `${c.title || c.field}: ${v}`;
    })
    .join(" · ");
}

// One entry per cited trial: its title and every value quoted from it (an edge or a scatter
// point quotes several). `total` is how many trials the data point counts (citations sample it).
function showCitations(title, citations, total) {
  $("citations").classList.remove("hidden");
  const byTrial = new Map();
  for (const c of citations) {
    if (!byTrial.has(c.nct_id)) byTrial.set(c.nct_id, { title: c.title, quotes: [] });
    const t = byTrial.get(c.nct_id);
    t.title = t.title || c.title;
    t.quotes.push(c);
  }
  const shown = byTrial.size;
  const all = Math.max(total || 0, shown);
  $("cite-title").textContent = `${title} (${shown === all ? "" : `${shown} of `}${all.toLocaleString()} trial${all === 1 ? "" : "s"}${shown === all ? "" : " shown"})`;
  const list = $("cite-list");
  list.replaceChildren();
  if (!citations.length) {
    list.append(Object.assign(document.createElement("li"), { textContent: "No trial-level sources for this value (registry-wide statistic)." }));
  }
  for (const [nct, { title: trialTitle, quotes }] of byTrial) {
    const li = document.createElement("li");
    const a = Object.assign(document.createElement("a"), {
      href: `https://clinicaltrials.gov/study/${nct}`, target: "_blank", rel: "noopener", textContent: nct,
    });
    li.append(a);
    if (trialTitle) li.append(Object.assign(document.createElement("div"), { className: "trial-title", textContent: trialTitle }));
    for (const q of quotes) {
      const line = document.createElement("div");
      line.append(`“${q.excerpt}”`);
      if (q.field) line.append(" ", Object.assign(document.createElement("code"), { textContent: q.field }));
      li.append(line);
    }
    list.append(li);
  }
  $("citations").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ClinicalTrials.gov API parameters, named for people. Unknown keys show as-is.
const PARAM_NAMES = {
  "query.term": "Search terms",
  "query.cond": "Condition",
  "query.intr": "Intervention",
  "query.spons": "Sponsor",
  "query.lead": "Lead sponsor",
  "query.locn": "Location",
  "query.titles": "Title",
  "query.outc": "Outcome",
  "query.id": "Study ID",
  "filter.overallStatus": "Status",
  "filter.geo": "Geography",
  "filter.ids": "NCT IDs",
  "filter.advanced": "Advanced filter",
};

// filters_applied is {steps: [{label, endpoint, params}]} (one search per step); anything else falls back to key: value.
function renderFilters(filters) {
  const entries = Object.entries(filters);
  if (!entries.length) return null;
  const ul = document.createElement("ul");
  ul.style.cssText = "margin:0;padding-left:18px";
  const show = (v) => (Array.isArray(v) ? v.map(show).join(", ") : v && typeof v === "object" ? JSON.stringify(v) : String(v));
  for (const [key, value] of entries) {
    if (key !== "steps" || !Array.isArray(value)) {
      ul.append(Object.assign(document.createElement("li"), { textContent: `${key}: ${show(value)}` }));
      continue;
    }
    for (const step of value) {
      const li = document.createElement("li");
      li.append(Object.assign(document.createElement("strong"), { textContent: step.label || "Search" }));
      if (step.endpoint && step.endpoint !== "studies") li.append(` (/${step.endpoint})`);
      const params = document.createElement("ul");
      params.style.cssText = "margin:2px 0 6px;padding-left:16px";
      for (const [p, v] of Object.entries(step.params || {})) {
        const item = document.createElement("li");
        item.append(`${PARAM_NAMES[p] || p}: `, Object.assign(document.createElement("code"), { textContent: show(v), title: p }));
        params.append(item);
      }
      li.append(params);
      ul.append(li);
    }
  }
  return ul;
}

function renderMeta(meta, viz) {
  const el = $("meta");
  el.replaceChildren();
  const add = (term, content) => {
    if (content == null || content === "" || (Array.isArray(content) && !content.length)) return;
    const dt = Object.assign(document.createElement("dt"), { textContent: term });
    const dd = document.createElement("dd");
    if (content instanceof Node) dd.append(content); else dd.textContent = content;
    dl.append(dt, dd);
  };
  for (const w of meta.warnings || []) el.append(Object.assign(document.createElement("div"), { className: "warn", textContent: w }));
  const dl = document.createElement("dl");
  el.append(dl);
  add("What was computed", meta.interpretation);
  add("Trials", `${meta.trials_analyzed.toLocaleString()} analyzed of ${meta.total_trials_matched.toLocaleString()} matched`);
  add("Chart", `${viz.type.replaceAll("_", " ")} · ${viz.intent.replaceAll("_", " ")}`);
  const yours = Object.entries(meta.request_filters || {});
  if (yours.length) {
    const ul = document.createElement("ul");
    ul.style.cssText = "margin:0;padding-left:18px";
    for (const [k, v] of yours) ul.append(Object.assign(document.createElement("li"), { textContent: `${k}: ${Array.isArray(v) ? v.join(", ") : v}` }));
    add("Your filters", ul);
  }
  const filters = renderFilters(meta.filters_applied || {});
  if (filters) add("Searches run", filters);
  if ((meta.assumptions || []).length) {
    const ul = document.createElement("ul");
    ul.style.cssText = "margin:0;padding-left:18px";
    for (const a of meta.assumptions) ul.append(Object.assign(document.createElement("li"), { textContent: a }));
    add("Assumptions", ul);
  }
  const units = Object.entries(meta.units || {}).map(([k, v]) => `${k}: ${v}`).join(", ");
  add("Units", units);
  add("Data as of", meta.data_as_of ? new Date(meta.data_as_of).toLocaleString() : null);
  add("Source", `ClinicalTrials.gov${meta.api_version ? ` API ${meta.api_version}` : ""}`);
}

// Network graphs have no Vega-Lite spec: a Fruchterman–Reingold layout drawn as SVG.
// Deterministic (no randomness), so the same response always draws the same picture.
function renderNetwork(viz) {
  const { nodes, edges } = viz.data;
  const W = 800, H = 580, NS = "http://www.w3.org/2000/svg";
  const box = { x0: 20, x1: W - 20, y0: 70, y1: H - 14 }; // title and legend rows sit above the plot
  const pw = box.x1 - box.x0, ph = box.y1 - box.y0, cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  const maxSize = Math.max(1, ...nodes.map((n) => n.size || 1));
  const maxWeight = Math.max(1, ...edges.map((e) => e.weight || 1));
  // Start on a sunflower spiral, nodes in the given order (largest first) from the centre out.
  const pts = nodes.map((n, i) => {
    const a = i * 2.39996, s = Math.sqrt((i + 0.5) / nodes.length);
    return { n, r: 5 + 13 * Math.sqrt((n.size || 1) / maxSize), x: cx + 0.4 * pw * s * Math.cos(a), y: cy + 0.4 * ph * s * Math.sin(a) };
  });
  const at = new Map(pts.map((p) => [p.n.id, p]));
  const links = edges.map((e) => ({ e, p: at.get(e.source), q: at.get(e.target) })).filter((l) => l.p && l.q);
  // Fruchterman–Reingold: repulsion k²/d between all nodes, attraction d²/k along edges (stronger
  // for heavier edges), mild gravity to the centre, moves capped by a cooling temperature.
  const k = 0.8 * Math.sqrt((pw * ph) / Math.max(1, pts.length));
  // Gravity G per pixel from the centre: stronger vertically (the box is wide) and for nodes
  // without edges, which repulsion alone would push far out.
  const ITER = 500, T0 = pw / 8, G = 0.5;
  for (const { p, q } of links) { p.deg = (p.deg || 0) + 1; q.deg = (q.deg || 0) + 1; }
  for (let it = 0; it < ITER; it++) {
    const temp = T0 * (1 - it / ITER) + 0.5;
    for (const p of pts) { const g = p.deg ? G : 5 * G; p.dx = g * (cx - p.x); p.dy = g * (cy - p.y) * (pw / ph); }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const p = pts[i], q = pts[j];
      let dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy);
      if (d < 0.01) { dx = 0.01 * (i - j); dy = 0.01; d = Math.hypot(dx, dy); }
      const f = (k * k) / d / d;
      p.dx += dx * f; p.dy += dy * f; q.dx -= dx * f; q.dy -= dy * f;
    }
    for (const { e, p, q } of links) {
      const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy) || 0.01;
      const f = (d / k) * (0.4 + 0.6 * (e.weight || 1) / maxWeight); // (d²/k) / d
      p.dx -= dx * f; p.dy -= dy * f; q.dx += dx * f; q.dy += dy * f;
    }
    for (const p of pts) {
      const d = Math.hypot(p.dx, p.dy) || 1, step = Math.min(d, temp) / d;
      p.x += p.dx * step; p.y += p.dy * step;
    }
  }
  // Fit the layout into the plot box, then push apart any circles that still overlap.
  const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
  const [minX, maxX, minY, maxY] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const pad = 22;
  for (const p of pts) {
    p.x = box.x0 + pad + (maxX > minX ? (p.x - minX) / (maxX - minX) : 0.5) * (pw - 2 * pad);
    p.y = box.y0 + pad + (maxY > minY ? (p.y - minY) / (maxY - minY) : 0.5) * (ph - 2 * pad);
  }
  for (let it = 0; it < 60; it++) for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const p = pts[i], q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy) || 0.01, gap = p.r + q.r + 3 - d;
    if (gap <= 0) continue;
    const ux = (dx / d) * gap / 2, uy = (dy / d) * gap / 2;
    p.x += ux; p.y += uy; q.x -= ux; q.y -= uy;
    for (const s of [p, q]) {
      s.x = Math.min(box.x1 - s.r, Math.max(box.x0 + s.r, s.x)); s.y = Math.min(box.y1 - s.r, Math.max(box.y0 + s.r, s.y));
    }
  }

  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const el = (tag, attrs, parent = svg) => {
    const node = document.createElementNS(NS, tag);
    for (const [key, v] of Object.entries(attrs)) node.setAttribute(key, v);
    parent.append(node);
    return node;
  };
  const tooltip = (node, text) => el("title", {}, node).textContent = text;
  el("text", { x: 8, y: 22, "font-weight": 600, "font-size": 15 }).textContent = viz.title;
  // Legend: one row under the title, never over the plot.
  const groups = [...new Set(nodes.map((n) => n.group))];
  const palette = ["#2f6fde", "#e0742b", "#2a9d6f", "#b5479b", "#8a6d1f", "#5b5bd6"];
  const color = (g) => palette[groups.indexOf(g) % palette.length];
  let lx = 14;
  for (const grp of groups.filter((g) => g != null)) {
    const name = String(grp).replaceAll("_", " ");
    el("circle", { cx: lx, cy: 44, r: 5, fill: color(grp) });
    el("text", { x: lx + 10, y: 48, "font-size": 12, fill: "#444" }).textContent = name[0].toUpperCase() + name.slice(1);
    lx += 34 + 6.5 * name.length;
  }
  const labelOf = (p) => `${p.n.label}${p.n.group ? ` (${String(p.n.group).replaceAll("_", " ")})` : ""}`;
  for (const { e, p, q } of links) {
    const line = el("line", { x1: p.x, y1: p.y, x2: q.x, y2: q.y, stroke: "#a9a9a0", "stroke-opacity": 0.55,
      "stroke-width": 0.8 + 5 * ((e.weight || 1) / maxWeight) });
    line.style.cursor = "pointer";
    tooltip(line, `${p.n.label} — ${q.n.label}: ${e.weight} trial${e.weight === 1 ? "" : "s"}`);
    line.addEventListener("click", () => showCitations(`${p.n.label} — ${q.n.label}`, e.citations || [], e.weight));
  }
  for (const p of [...pts].sort((a, b) => a.r - b.r)) { // big nodes on top
    const g = el("g", {});
    g.style.cursor = "pointer";
    el("circle", { cx: p.x, cy: p.y, r: p.r, fill: color(p.n.group), stroke: "#fff", "stroke-width": 1.5 }, g);
    tooltip(g, `${labelOf(p)}${p.n.size != null ? `: ${p.n.size} trial${p.n.size === 1 ? "" : "s"}` : ""}`);
    g.addEventListener("click", () => showCitations(p.n.label, p.n.citations || [], p.n.size));
  }
  // Labels for the 12 largest nodes: try right, left, above, below; keep the spot that overlaps
  // other labels and nodes least.
  const placed = [];
  const overlap = (a, b) => Math.max(0, Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0)) * Math.max(0, Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0));
  const discs = pts.map((p) => ({ x0: p.x - p.r, x1: p.x + p.r, y0: p.y - p.r, y1: p.y + p.r }));
  for (const p of [...pts].sort((a, b) => (b.n.size || 0) - (a.n.size || 0)).slice(0, 12)) {
    const text = p.n.label.length > 30 ? `${p.n.label.slice(0, 29)}…` : p.n.label;
    const w = 6.3 * text.length, h = 14;
    const spots = [
      { x: p.x + p.r + 4, y: p.y + 4, anchor: "start", bx: p.x + p.r + 4 },
      { x: p.x - p.r - 4, y: p.y + 4, anchor: "end", bx: p.x - p.r - 4 - w },
      { x: p.x, y: p.y - p.r - 5, anchor: "middle", bx: p.x - w / 2 },
      { x: p.x, y: p.y + p.r + 14, anchor: "middle", bx: p.x - w / 2 },
    ].map((s) => {
      const b = { x0: s.bx, x1: s.bx + w, y0: s.y - h + 3, y1: s.y + 3 };
      const out = Math.max(0, box.x0 - 12 - b.x0) + Math.max(0, b.x1 - box.x1 - 12) + Math.max(0, box.y0 - b.y0) + Math.max(0, b.y1 - H);
      const cost = out * 1000 + placed.reduce((c, o) => c + 3 * overlap(b, o), 0) + discs.reduce((c, o) => c + overlap(b, o), 0);
      return { ...s, b, cost };
    });
    const best = spots.reduce((a, b) => (b.cost < a.cost ? b : a));
    placed.push(best.b);
    const t = el("text", { x: best.x, y: best.y, "text-anchor": best.anchor, "font-size": 12, fill: "#222",
      stroke: "#fff", "stroke-width": 3, "stroke-linejoin": "round", "paint-order": "stroke" });
    t.textContent = text;
    t.style.cursor = "pointer";
    tooltip(t, labelOf(p));
    t.addEventListener("click", () => showCitations(p.n.label, p.n.citations || [], p.n.size));
  }
  $("network").replaceChildren(svg);
}

// Start over: clear the question, filters and any result, and stop following the current task.
$("reset").addEventListener("click", () => {
  clearInterval(polling);
  $("query").value = "";
  resetFilters();
  setBusy(false);
  $("error").classList.add("hidden");
  $("result").classList.add("hidden");
  $("citations").classList.add("hidden");
  history.replaceState(null, "", location.pathname);
  $("query").focus();
});

$("copy-json").addEventListener("click", () => navigator.clipboard.writeText($("raw-json").textContent));

// View a saved run (data/queries/<task_id>/response.json) without calling the agent.
$("open-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  clearInterval(polling);
  setBusy(false, file.name);
  $("error").classList.add("hidden");
  try {
    const result = JSON.parse(await file.text());
    if (!result.visualization || !result.meta) throw new Error("Not a cheiron response.json (needs visualization and meta).");
    await render(result);
  } catch (err) {
    showError(`Could not open ${file.name}: ${err.message}`);
  }
});

// Reopen a running or finished task from the URL (?task=<id>), or an answer made in Claude
// (?result=<id>, served by `cheiron-mcp`).
const params = new URLSearchParams(location.search);
const resumeId = params.get("task");
const resultId = params.get("result");
if (resumeId) poll(resumeId);
else if (resultId) openResult(resultId);

async function openResult(id) {
  document.documentElement.dataset.mode = "result";
  try {
    const res = await fetch(`/results/${encodeURIComponent(id)}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
    await render(body);
  } catch (err) {
    showError(`Could not open result ${id}: ${err.message}`);
  }
}

// Inside Claude: the page is an MCP App (ui://cheiron/chart) and gets the build_chart result from
// the host. The full answer is in the result's _meta; if a host drops it, ask the server for it.
if (document.documentElement.dataset.mode === "mcp-app" && window.McpApps) {
  const app = new McpApps.App({ name: "cheiron", version: "1.0.0" }, {}, { autoResize: true });
  app.ontoolresult = async (result) => {
    try {
      if (result.isError) throw new Error((result.content || []).map((c) => c.text).join(" ") || "The chart could not be built.");
      let answer = result._meta && result._meta["cheiron/response"];
      const id = result._meta && result._meta["cheiron/result_id"];
      if (!answer && id) {
        const got = await app.callServerTool({ name: "get_result", arguments: { result_id: id } });
        answer = got.structuredContent || JSON.parse(got.content[0].text);
      }
      if (!answer) throw new Error("The tool result has no chart.");
      await render(answer);
    } catch (err) {
      showError(err.message);
    }
  };
  // Links (trial citations) open through the host: the sandbox blocks new windows.
  document.addEventListener("click", (event) => {
    const a = event.target.closest && event.target.closest("a[href^='http']");
    if (!a) return;
    event.preventDefault();
    app.openLink({ url: a.href });
  });
  app.connect().catch((err) => showError(`Could not connect to Claude: ${err.message}`));
}
</script>
