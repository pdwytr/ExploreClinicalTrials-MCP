[project]
name = "studytrials-mcp"
version = "0.1.0"
description = "MCP server: ask about clinical trials in any MCP client and get a chart from ClinicalTrials.gov where every value cites its trials"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "pdwytr" }]
keywords = ["mcp", "mcp-server", "clinical-trials", "clinicaltrials.gov", "charts", "claude", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0",  # MCP server (studytrials-mcp), incl. MCP Apps
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.66.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6",  # agent specs and the OpenAPI spec the agent reads
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/pdwytr/studytrials"
Issues = "https://github.com/pdwytr/studytrials/issues"

[project.scripts]
studytrials-mcp = "studytrials.mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "altair>=5",    # validates generated specs against the official Vega-Lite schema
    "networkx>=3.4", # checks NetworkData round-trips through node_link_graph
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studytrials"]

[tool.hatch.build.targets.wheel.force-include]
"docs/ctgov" = "studytrials/agents/ctgov-snapshot"  # the API reference fallback, for installs (uvx)

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
