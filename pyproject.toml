[project]
name = "cheiron"
version = "0.1.0"
description = "ClinicalTrials.gov query-to-visualization backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]>=2.66.0",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "altair>=5",    # validates generated specs against the official Vega-Lite schema
    "networkx>=3.4", # checks NetworkData round-trips through node_link_graph
    "pyyaml>=6",     # skill frontmatter tests and scripts/build_ctgov_skill.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheiron"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
